name: queueless-prod

services:
  db:
    image: postgres:16-alpine
    container_name: queueless-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-queueless}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-queueless}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not published: only the frontend may reach the database.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: queueless-backend:latest
    container_name: queueless-prod-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-queueless}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api
        VITE_USE_MOCK_API: "false"
    image: queueless-frontend:latest
    container_name: queueless-prod-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data_prod: