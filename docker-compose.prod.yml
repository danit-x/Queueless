name: queueless-prod

services:
  db:
    image: postgres:16-alpine
    container_name: queueless-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-queueless}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-queueless}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not published: only the frontend may reach the database.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: queueless-backend:latest
    container_name: queueless-prod-backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-queueless}
      DATABASE_SSL: "off"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      # The schema is applied once by the database container on volume creation.
      # Production only verifies it, so a bad migration fails the deploy instead
      # of silently rewriting tables at boot.
      AUTO_MIGRATE: "false"
      # nginx terminates the client connection, so honour X-Forwarded-* headers.
      TRUST_PROXY: "true"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api
        VITE_USE_MOCK_API: "false"
    image: queueless-frontend:latest
    container_name: queueless-prod-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data_prod: