name: queueless

services:
  db:
    image: postgres:16-alpine
    container_name: queueless-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-queueless}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-queueless}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: queueless-backend
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-queueless}
      DATABASE_SSL: "off"
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me-now}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      # schema.sql is mounted below, so the dev stack self-heals the database.
      SCHEMA_PATH: /app/database/schema.sql
      AUTO_MIGRATE: "true"
      TRUST_PROXY: "false"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend/src:/app/src:ro
      - ./database/schema.sql:/app/database/schema.sql:ro
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: queueless-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
      VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-true}
      VITE_PROXY_TARGET: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - -/app/node_modules
    depends_on:
      - backend

volumes:
  db_data: