server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Re-resolve the backend name so /api keeps working if the backend restarts.
    # NGINX_LOCAL_RESOLVERS is filled in at container start from the nameservers
    # in /etc/resolv.conf (nginx image entrypoint). Hard-coding Docker's
    # 127.0.0.11 broke under rootless Docker on the lab PC (connection refused).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Profile photos are up to 2 MB (express.raw limit in authRoutes.js).
    client_max_body_size 2m;

    # Docker healthcheck target
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        set $api_upstream http://backend:5000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
}